<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#539BF5"/>
      <stop offset="50%" stop-color="#123B70"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <!-- ondas animadas -->
  <path fill="#0D1117" fill-opacity="0.35">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 190 C 300 150, 500 230, 800 190 S 1100 160, 1200 190 V240 H0 Z;
              M0 190 C 300 230, 500 150, 800 200 S 1100 220, 1200 180 V240 H0 Z;
              M0 190 C 300 150, 500 230, 800 190 S 1100 160, 1200 190 V240 H0 Z"/>
  </path>
  <path fill="#0D1117">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 210 C 250 180, 550 240, 850 205 S 1100 190, 1200 210 V240 H0 Z;
              M0 205 C 250 235, 550 185, 850 215 S 1100 230, 1200 200 V240 H0 Z;
              M0 210 C 250 180, 550 240, 850 205 S 1100 190, 1200 210 V240 H0 Z"/>
  </path>

  <!-- texto -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="600" y="105" font-size="64" font-weight="700" opacity="0">
      Josué Gutilla
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="600" y="148" font-size="22" fill="#C9D1D9" letter-spacing="1" opacity="0">
      Software Developer • C# &amp; .NET • Full Stack
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
    </text>
  </g>
</svg>
